name: Android APK experiment
on:
  push:
    branches: [android-apk-experiment]
    paths: [buildconfig/android/**, .github/workflows/android-apk-experiment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config cmake ninja-build ccache gettext autopoint
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          pip install 'git+https://github.com/kivy/python-for-android@9562d1b4f306d0af1e76991c711114010dea4152' 'Cython==3.2.4' 'setuptools<82' maturin
      - name: Build APK
        run: bash buildconfig/android/build.sh
      - name: Verify package
        run: |
          apk=dist/android/Tuxemon-arm64.apk
          unzip -tq "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Tuxemon-arm64
          path: dist/android/Tuxemon-arm64.apk
